<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entry-Level Job Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Entry-Level Job Agent</p>
          <h1>Data and software job tracker</h1>
        </div>
        <div class="actions">
          <button id="scanButton" class="primary-button" type="button">Scan</button>
          <a class="secondary-button" href="/exports/jobs.csv">Accepted CSV</a>
          <a class="secondary-button" href="/exports/job-candidates.csv">Audit CSV</a>
        </div>
      </header>

      <section class="status-grid" aria-live="polite">
        <div>
          <span>Accepted</span>
          <strong id="acceptedCount">0</strong>
        </div>
        <div>
          <span>Fetched Audit</span>
          <strong id="candidateCount">0</strong>
        </div>
        <div>
          <span>Sources</span>
          <strong id="sourceCount">0</strong>
        </div>
        <div>
          <span>Status</span>
          <strong id="statusText">Ready</strong>
        </div>
      </section>

      <section class="toolbar">
        <div class="tabs" role="tablist" aria-label="Job tables">
          <button id="acceptedTab" class="tab active" type="button">Accepted Jobs</button>
          <button id="auditTab" class="tab" type="button">Fetched Audit</button>
        </div>
        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Title, company, source..." />
        </label>
      </section>

      <section class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" hidden>No rows yet.</div>
      </section>

      <section class="scan-log">
        <div class="log-heading">
          <h2>Last scan</h2>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div id="scanLog" class="log-lines"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
